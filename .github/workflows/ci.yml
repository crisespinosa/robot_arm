# ==============================================================================
# CI/CD — непрерывная интеграция для проекта robot_arm
#
# Выполняет:
#   1. Проверку синтаксиса Python (flake8 — основные ошибки)
#   2. Проверку типов Python (mypy — аннотации типов)
#   3. Проверку импортов и зависимостей Python
#   4. Сборку C++ бэкенда (CMake + Drogon)
#
# Запускается при push/PR в ветки main и develop.
# ==============================================================================

name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # ----------------------------------------------------------------
  # Задача 1: Проверка Python-кода (линтинг, типы, зависимости)
  # ----------------------------------------------------------------
  python-lint:
    name: "Python: линтинг и проверка типов"
    runs-on: ubuntu-latest

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Установка Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Установка зависимостей Python
        run: |
          python -m pip install --upgrade pip
          pip install -r robot_arm/requirements.txt
          pip install flake8 mypy

      - name: "Flake8: проверка синтаксиса и стиля"
        run: |
          flake8 robot_arm/python/ \
            --max-line-length=120 \
            --ignore=E501,W503,E402,E303,W504,E266,W291,W293,E302,E305,E261,E262,W292,E231,E225,E226,E228,E251,F401 \
            --count --show-source --statistics \
            || true

      - name: "Mypy: проверка аннотаций типов"
        run: |
          mypy robot_arm/python/ \
            --ignore-missing-imports \
            --no-strict-optional \
            --allow-untyped-defs \
            || true

      - name: "Проверка импортов: все модули доступны"
        run: |
          cd robot_arm/python
          python -c "
          import env_backend_robot_arm
          import ppo_inference_server
          print('Все модули Python импортируются успешно.')
          "

  # ----------------------------------------------------------------
  # Задача 2: Сборка C++ бэкенда (CMake + Drogon)
  # ----------------------------------------------------------------
  cpp-build:
    name: "C++: сборка бэкенда (CMake + Drogon)"
    runs-on: ubuntu-latest

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Установка системных зависимостей
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            libjsoncpp-dev \
            uuid-dev \
            zlib1g-dev \
            libssl-dev \
            libsqlite3-dev

      - name: Сборка и установка Drogon из исходников
        run: |
          git clone --depth 1 --branch v1.9.1 \
            https://github.com/drogonframework/drogon.git /tmp/drogon
          cd /tmp/drogon
          git submodule update --init
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
                   -DBUILD_TESTING=OFF \
                   -DBUILD_EXAMPLES=OFF
          make -j$(nproc)
          sudo make install

      - name: "CMake: конфигурация проекта"
        run: |
          cd robot_arm
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release

      - name: "Make: компиляция бэкенда"
        run: |
          cd robot_arm/build
          make -j$(nproc)

      - name: "Проверка: исполняемый файл создан"
        run: |
          test -f robot_arm/build/robot_arm && echo "Сборка прошла успешно: robot_arm/build/robot_arm" || exit 1
