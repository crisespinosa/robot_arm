# ==============================================================================
# CI/CD — непрерывная интеграция для проекта robot_arm
#
# Выполняет:
#   - Сборку C++ бэкенда (CMake + Drogon)
#
# Запускается при push/PR в ветки main и develop.
# ==============================================================================

name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # ----------------------------------------------------------------
  # Сборка C++ бэкенда (CMake + Drogon)
  # ----------------------------------------------------------------
  cpp-build:
    name: "C++: сборка бэкенда (CMake + Drogon)"
    runs-on: ubuntu-latest

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Установка системных зависимостей
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            libjsoncpp-dev \
            uuid-dev \
            zlib1g-dev \
            libssl-dev \
            libsqlite3-dev

      - name: Сборка и установка Drogon из исходников
        run: |
          git clone --depth 1 --branch v1.9.1 \
            https://github.com/drogonframework/drogon.git /tmp/drogon
          cd /tmp/drogon
          git submodule update --init
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
                   -DBUILD_TESTING=OFF \
                   -DBUILD_EXAMPLES=OFF
          make -j$(nproc)
          sudo make install

      - name: "CMake: конфигурация проекта"
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release

      - name: "Make: компиляция бэкенда"
        run: |
          cd build
          make -j$(nproc)

      - name: "Проверка: исполняемый файл создан"
        run: |
          test -f build/robot_arm && echo "Сборка прошла успешно: build/robot_arm" || exit 1
